name: Build HDR Studio

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install PE resource tools
        run: sudo apt-get update && sudo apt-get install -y binutils python3

      - name: Build Windows binaries
        env:
          HDRSTUDIO_VERSION: 1.1.0.0
        run: ./build.sh

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: HDRStudio-unsigned
          path: |
            dist/HDRStudio_x64.exe
            dist/HDRStudio_x86.exe

  finalize:
    needs: build
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: HDRStudio-unsigned
          path: dist

      - name: Sign executables when credentials are configured
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "hdrstudio-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "SignTool.exe was not found on the runner." }

          $timestamp = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestamp)) { $timestamp = "http://timestamp.digicert.com" }

          foreach ($file in @("dist\HDRStudio_x64.exe", "dist\HDRStudio_x86.exe")) {
            & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr $timestamp /td SHA256 /d "HDR Studio" $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $file" }
            & $signtool verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $file" }
          }
          Remove-Item $pfx -Force

      - name: Warn when the build is unsigned
        if: env.WINDOWS_CERTIFICATE_BASE64 == ''
        shell: pwsh
        run: Write-Warning "Signing credentials are not configured. Publishing unsigned binaries."

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $items = Get-ChildItem dist\HDRStudio_*.exe | Sort-Object Name
          $lines = foreach ($item in $items) {
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          Set-Content -Path dist\SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Upload final binaries
        uses: actions/upload-artifact@v4
        with:
          name: HDRStudio-Windows
          path: dist/

      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist\HDRStudio_x64.exe dist\HDRStudio_x86.exe dist\SHA256SUMS.txt --generate-notes --title "HDR Studio ${{ github.ref_name }}"
